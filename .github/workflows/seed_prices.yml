name: Seed Historical Prices

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip --no-cache-dir
          .venv/bin/pip install --no-cache-dir supabase "yfinance==1.4.0" "websockets>=13.0" python-dotenv pandas requests textblob
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
        run: .venv/bin/python update_prices.py --backfill-risk
